services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ugram
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  deps:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    command:
      - sh
      - -ce
      - |
        corepack enable
        corepack prepare pnpm@10.29.2 --activate
        LOCK=$$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)
        if [ -f node_modules/.pnpm-lock.hash ] && [ "$$LOCK" = "$$(cat node_modules/.pnpm-lock.hash)" ]; then
          echo "deps up to date"
        else
          pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
          echo "$$LOCK" > node_modules/.pnpm-lock.hash
        fi
    environment:
      HUSKY: "0"
      PNPM_FETCH_RETRIES: "5"
      PNPM_FETCH_TIMEOUT: "600000"
      PNPM_NETWORK_CONCURRENCY: "4"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    command: sh -c "corepack enable && corepack prepare pnpm@10.29.2 --activate && pnpm --filter api exec prisma generate && pnpm --filter api exec prisma migrate deploy && pnpm --filter api exec prisma db seed && pnpm --filter api dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ugram?schema=public
      PORT: "4000"
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      HUSKY: "0"
    ports:
      - "4001:4000"
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -f -X POST -H ''Content-Type: application/json'' -d ''{"query":"{ __typename }"}'' http://localhost:4000/graphql || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    command: sh -c "corepack enable && corepack prepare pnpm@10.29.2 --activate && pnpm --filter web codegen && pnpm --filter web dev"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      HUSKY: "0"
      GRAPHQL_SCHEMA_URL: "http://api:4000/graphql"
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-dev}
      VITE_GRAPHQL_URL: "http://localhost:4001/graphql"
    ports:
      - "5173:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_healthy
  
  # Prisma Studio - Optional database inspector
  # Usage:
  #   Start: docker compose --profile studio up
  #   Stop:  docker compose --profile studio down
  # Access at http://localhost:5555
  studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /app/apps/api
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    command: sh -c "corepack enable && corepack prepare pnpm@10.29.2 --activate && pnpm dlx prisma studio --browser none --port 5555"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ugram?schema=public
    ports:
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    profiles:
      - studio

volumes:
  db_data:
  node_modules:
  api_node_modules:
  web_node_modules:
  pnpm_store:
