services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ugram
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  deps:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile --ignore-scripts"
    environment:
      HUSKY: "0"
      PNPM_FETCH_RETRIES: "5"
      PNPM_FETCH_TIMEOUT: "600000"
      PNPM_NETWORK_CONCURRENCY: "4"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm --filter api dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ugram?schema=public
      PORT: "4000"
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      HUSKY: "0"
    ports:
      - "4001:4000"
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully

  web:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm --filter web dev"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      HUSKY: "0"
    ports:
      - "5173:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  db_data:
  node_modules:
  pnpm_store:
