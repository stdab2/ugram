services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ugram
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules_api:/app/node_modules
    command: sh -c "npm install && npm run dev:api"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ugram?schema=public
      PORT: "4000"
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      HUSKY: "0"
    ports:
      - "4001:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules_web:/app/node_modules
    command: sh -c "npm install && npm run dev:web -- --host 0.0.0.0 --port 5173"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      HUSKY: "0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
  node_modules_api:
  node_modules_web:
