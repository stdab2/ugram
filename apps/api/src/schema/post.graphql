type Post {
  id: Int!
  description: String!
  imageUrl: String!
  authorId: Int!
  author: UserUgram!
  createdAt: DateTime!
}

extend type Query {
  post(id: Int!): Post
  posts(limit: Int, offset: Int): [Post!]!
  postsByAuthor(authorId: Int!, limit: Int, offset: Int): [Post!]!
}

extend type Mutation {
  deletePost(id: Int!): Post!
  updatePost(id: Int!, description: String!): Post!
}
