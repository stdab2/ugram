type SearchResults {
	users: [UserUgram!]!
	posts: [Post!]!
	hashtags: [HashtagResult!]!
}

type HashtagResult {
	id: Int!
	name: String!
	postCount: Int!
}

type AutocompleteUser {
	id: Int!
	userName: String!
	firstName: String!
	lastName: String!
	picture: String
}

type AutocompletePost {
	id: Int!
	description: String!
	imageUrl: String!
}

type AutocompleteHashtag {
	id: Int!
	name: String!
	postCount: Int!
}

type AutocompleteResults {
	users: [AutocompleteUser!]!
	posts: [AutocompletePost!]!
	hashtags: [AutocompleteHashtag!]!
}

extend type Query {
	search(
		query: String!
		usersLimit: Int = 20
		usersOffset: Int = 0
		postsLimit: Int = 20
		postsOffset: Int = 0
		hashtagsLimit: Int = 20
		hashtagsOffset: Int = 0
	): SearchResults!

	searchAutocomplete(query: String!, limit: Int = 8): AutocompleteResults!
}
