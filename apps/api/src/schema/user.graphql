type UserUgram {
  id: Int!
  userName: String!
  email: String!
  firstName: String!
  lastName: String!
}

extend type Query {
  user(id: Int!): UserUgram
  users: [UserUgram!]!
}

extend type Mutation {
  createUser(
    userName: String!
    email: String!
    password: String!
    firstName: String!
    lastName: String!
    phoneNumber: String!
    picture: String
  ): UserUgram!
}
