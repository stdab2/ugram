type UserUgram {
	id: Int!
	userName: String!
	email: String!
	firstName: String!
	lastName: String!
	phoneNumber: String!
	picture: String
	posts: [Post!]
}

extend type Query {
	user(id: Int!): UserUgram
	userByUserName(userName: String!): UserUgram
	users: [UserUgram!]!
}

extend type Mutation {
	createUser(
		userName: String!
		email: String!
		password: String!
		firstName: String!
		lastName: String!
		phoneNumber: String!
		picture: Upload
	): UserUgram!
	updateUser(
		id: Int!
		userName: String
		email: String
		password: String
		firstName: String
		lastName: String
		phoneNumber: String
		picture: Upload
	): UserUgram!
}
