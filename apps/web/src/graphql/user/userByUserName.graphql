query UserByUserName($userName: String!) {
	userByUserName(userName: $userName) {
		id
		userName
		firstName
		lastName
		picture
		createdAt
		followerCount
		followingCount
		isFollowedByCurrentUser
		posts {
			id
			thumbnailUrl
			imageKey
			imageStatus
			description
			createdAt
			messageCount
			likeCount
			isLikedByCurrentUser
		}
	}
}
