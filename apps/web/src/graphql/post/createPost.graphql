mutation CreatePost($data: CreatePostInput!) {
	createPost(data: $data) {
		id
		description
		thumbnailUrl
		createdAt
		likeCount
		isLikedByCurrentUser
		author {
			id
			userName
			firstName
			lastName
			picture
		}
		hashtags {
			id
			name
		}
		mentionedUsers {
			id
			userName
		}
		imageKey
		imageStatus
	}
}
