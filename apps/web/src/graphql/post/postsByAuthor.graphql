query PostsByAuthor($authorId: Int!, $limit: Int, $offset: Int) {
	postsByAuthor(authorId: $authorId, limit: $limit, offset: $offset) {
		id
		description
		imageUrl
		createdAt
		messageCount
		likeCount
		isLikedByCurrentUser
		author {
			id
			userName
			firstName
			lastName
			picture
		}
		imageKey
		imageStatus
	}
}
