name: API CI

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - "apps/api/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "eslint.config.js"
      - "tsconfig*.json"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main, master, develop]
    paths:
      - "apps/api/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "eslint.config.js"
      - "tsconfig*.json"
      - ".github/workflows/api-ci.yml"

jobs:
  lint-and-build-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm exec prisma generate

      - name: Lint API
        run: pnpm exec eslint "apps/api/**/*.{ts,tsx}" --ignore-pattern "apps/api/generated/**" --max-warnings=0

      - name: Build API
        working-directory: ./apps/api
        env:
          # Variables minimales pour le build CI
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PORT: 4000
          JWT_SECRET: ci-jwt-secret-for-build-only
          CLIENT_ID: ci-client-id
          CLIENT_SECRET: ci-client-secret
          GOOGLE_REDIRECT_URI: http://localhost:4000/oauth2/callback/google
          GOOGLE_CLIENT_ID: ci-client-id
          AWS_REGION: ca-central-1
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
          S3_BUCKET: ci-bucket
          ENV: ci
          FRONTEND_ORIGIN: http://localhost:3000
        run: pnpm --filter api build
