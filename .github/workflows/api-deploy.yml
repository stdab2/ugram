name: Deploy API to Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm exec prisma generate

      - name: Build API
        run: |
          pnpm run build:api

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cd apps/api

          # Copier les fichiers essentiels
          cp -r dist ../../deploy/
          cp -r generated ../../deploy/
          cp -r prisma ../../deploy/
          cp -r .ebextensions ../../deploy/
          cp -r .platform ../../deploy/
          cp dist/prisma.config.js ../../deploy/prisma.config.js
          cp package.json ../../deploy/
          cp Procfile ../../deploy/

          # Créer les dossiers uploads
          mkdir -p ../../deploy/uploads/post
          mkdir -p ../../deploy/uploads/profile
          mkdir -p ../../deploy/src
          cp dist/src/database-url.js ../../deploy/src/database-url.js

          # Laisser Elastic Beanstalk installer les dependances via npm

      - name: Generate deployment package
        run: |
          cd deploy
          zip -r ../deploy.zip . -x '*.git*'
          cd ..
          ls -lh deploy.zip

      - name: Get timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ugram-api
          environment_name: production
          version_label: "v-${{ steps.timestamp.outputs.timestamp }}-${{ github.sha }}"
          region: ca-central-1
          deployment_package: deploy.zip
          wait_for_deployment: true
          wait_for_environment_recovery: 300

  publish-docs:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Generate static API docs
        run: |
          pnpm --filter api docs:generate

      - name: Upload generated API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-${{ github.sha }}
          path: docs/api

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

      - name: Deploy docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
