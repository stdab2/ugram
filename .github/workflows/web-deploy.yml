name: Deploy Web to S3

on:
  push:
    branches: [main, feature/environment-variables]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-deploy.yml"
    tags:
      - "Release-*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate GraphQL types
        run: pnpm --filter web codegen

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.ref_name }}-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Build for production
        run: pnpm --filter web build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GRAPHQL_URL: ${{ secrets.VITE_GRAPHQL_URL }}
          VITE_MEDIA_BASE_URL: ${{ secrets.VITE_MEDIA_BASE_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Validate deployment secrets
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [[ -z "$AWS_S3_BUCKET" ]]; then
            echo "::error::Missing secret AWS_S3_BUCKET."
            exit 1
          fi

          if [[ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]]; then
            echo "::error::Missing secret CLOUDFRONT_DISTRIBUTION_ID."
            exit 1
          fi

          if [[ -z "$AWS_ROLE_ARN" && ( -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ) ]]; then
            echo "::error::Missing AWS auth secrets. Set AWS_ROLE_ARN (recommended) or both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

      - name: Determine AWS auth method
        id: auth_method
        run: |
          if [[ -n "$AWS_ROLE_ARN" ]]; then
            echo "method=oidc" >> $GITHUB_OUTPUT
          else
            echo "method=key" >> $GITHUB_OUTPUT
          fi
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - name: Configure AWS credentials (OIDC)
        if: steps.auth_method.outputs.method == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ca-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-web-deploy

      - name: Configure AWS credentials (Access key fallback)
        if: steps.auth_method.outputs.method == 'key'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ca-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy to S3
        run: |
          aws s3 sync apps/web/dist/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "index.html" \
            --exclude "*.json"

          # index.html sans cache pour forcer les mises à jour
          aws s3 cp apps/web/dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/" "/index.html"

      - name: Deployment summary
        run: |
          echo "✅ Deployment successful!"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "🌐 URL: http://${{ secrets.AWS_S3_BUCKET }}.s3-website.ca-central-1.amazonaws.com"
